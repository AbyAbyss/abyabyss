<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 158 34" width="158" height="34" role="img" aria-label="Apache Airflow"><title>Apache Airflow</title><style>svg{--bg:#0b1f27;--ink:#e6fffa;--dim:#8fb5b0;--edge:rgba(134,179,173,.3)}@media (prefers-color-scheme:light){svg{--bg:#f1faf8;--ink:#0b2b35;--dim:#47707a;--edge:rgba(11,43,53,.2)}}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.run{animation:run 4.5s linear infinite}@keyframes run{to{stroke-dashoffset:-100}}.fb{transform-box:fill-box;transform-origin:center}.pg{animation:pg 2.4s ease-out infinite}@keyframes pg{from{transform:scale(1);opacity:.7}to{transform:scale(3);opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.rm{display:none}}</style><defs></defs><rect x="1" y="1" width="156" height="32" rx="16.0" fill="var(--bg)" stroke="var(--edge)" stroke-width="1.2"/><rect class="run rm" x="1" y="1" width="156" height="32" rx="16.0" fill="none" stroke="#017CEE" stroke-width="1.6" stroke-linecap="round" pathLength="100" stroke-dasharray="16 84" style="animation-delay:-4.07s"/><circle class="pg fb rm" cx="18" cy="17.0" r="4" fill="#017CEE" style="animation-delay:-4.07s"/><circle cx="18" cy="17.0" r="4" fill="#017CEE"/><text class="mono" x="31" y="21.5" font-size="13" font-weight="700" fill="var(--ink)">Apache Airflow</text></svg>
