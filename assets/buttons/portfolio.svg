<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 252 58" width="252" height="58" role="img" aria-label="Portfolio: abyabyss.github.io"><title>Portfolio: abyabyss.github.io</title><style>svg{--bg:#0b1f27;--ink:#e6fffa;--dim:#8fb5b0;--edge:rgba(134,179,173,.3)}@media (prefers-color-scheme:light){svg{--bg:#f1faf8;--ink:#0b2b35;--dim:#47707a;--edge:rgba(11,43,53,.2)}}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.run{animation:run 4.5s linear infinite}@keyframes run{to{stroke-dashoffset:-100}}.arr{animation:arr 1.6s ease-in-out infinite alternate}@keyframes arr{to{transform:translateX(6px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.rm{display:none}}</style><defs></defs><rect x="1" y="1" width="250" height="56" rx="14" fill="var(--bg)" stroke="var(--edge)" stroke-width="1.2"/><rect class="run rm" x="1" y="1" width="250" height="56" rx="14" fill="none" stroke="#2ED3A7" stroke-width="2" stroke-linecap="round" pathLength="100" stroke-dasharray="14 86" style="animation-delay:-0.0s"/><text class="sans" x="20" y="26" font-size="16" font-weight="700" fill="var(--ink)">Portfolio</text><text class="mono" x="20" y="44" font-size="11.5" fill="var(--dim)">abyabyss.github.io</text><path class="arr" d="M208 29 h16 m-6 -6 l6 6 l-6 6" fill="none" stroke="#2ED3A7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
