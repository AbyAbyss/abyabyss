<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" height="372" role="img" aria-label="AI platform: an agent runtime connected to models, memory and RAG, subagents, MCP servers, tools and APIs, and approvals. Data platform: Airbyte to DuckDB to Apache Airflow."><title>AI platform: an agent runtime connected to models, memory and RAG, subagents, MCP servers, tools and APIs, and approvals. Data platform: Airbyte to DuckDB to Apache Airflow.</title><style>svg{--top:#051c26;--bot:#04151d;--ink:#eafff9;--dim:#86b3ad;--accent:#2ED3A7;--accent2:#4cc9f0;--accent3:#9d6bff;--line:rgba(46,211,167,.28);--glass:rgba(2,14,20,.58);--unlit:#5c9c93;--hull:#0f2f38;--sky0:#050a16;--sky1:#0d1b30;--skyink:#8fb0c9;--orb:#f3efd2;--stars:1;--ray:#bafff0;--rayo:.1}@media (prefers-color-scheme:light){svg{--top:#0b5a72;--bot:#094960;--ink:#ffffff;--dim:#d2f1f1;--accent:#8af7da;--accent2:#b3efff;--accent3:#dccbff;--line:rgba(255,255,255,.34);--glass:rgba(3,40,54,.5);--unlit:#a5dcda;--hull:#0a4a5c;--sky0:#8fd6ff;--sky1:#e2f6ff;--skyink:#14587a;--orb:#fff6bf;--stars:0;--ray:#ffffff;--rayo:.26}}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.fb{transform-box:fill-box;transform-origin:center}
.wire{stroke-width:1.4;stroke-dasharray:4 6;stroke-opacity:.55;animation:march 1s linear infinite}
@keyframes march{to{stroke-dashoffset:-10}}
.pk{animation:pk 2.6s cubic-bezier(.4,0,.6,1) infinite}
@keyframes pk{0%{transform:translate(0,0);opacity:0}12%,88%{opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
.nd{stroke-width:1.5;animation:nd 2.6s ease-in-out infinite}
@keyframes nd{0%,55%,100%{stroke-opacity:.4}20%{stroke-opacity:1}}
.halo{animation:halo 3.2s ease-out infinite}
@keyframes halo{from{transform:scale(.6);opacity:.7}to{transform:scale(1.9);opacity:0}}
@media (max-width:560px){.mh{display:none}.n{transform:scale(1.45)}}
